name: Red Reactor Battery Monitor
description: Red Reactor Battery Monitoring service
version: 37d536a
slug: redreactor
url: https://github.com/mreditor97/app-redreactor
startup: services
arch:
- aarch64
init: false
privileged:
- SYS_ADMIN
devices:
- /dev/i2c-1
map:
- ssl:ro
hassio_api: true
hassio_role: manager
services:
- mqtt:want
options:
  mqtt:
    tls:
      enabled: false
  hostname:
    name: redreactor-pi
    pretty: Raspberry Pi
  homeassistant:
    discovery_interval: 120
    expire_after: 120
  ina: {}
  system:
    shutdown: ha host shutdown
    restart: ha host restart
  logging:
    console: INFO
    file: WARNING
schema:
  mqtt:
    broker: str?
    port: port?
    user: str?
    password: password?
    client_id: str?
    tls:
      enabled: bool
      ca_certs: str?
      certfile: str?
      keyfile: str?
      insecure: bool?
  hostname:
    name: match(^[^/+#]+$)
    pretty: str
  homeassistant:
    discovery: bool?
    discovery_interval: int(1,)
    expire_after: int(0,)
  ina:
    address: int(3,119)?
    monitor_interval: int(1,60)?
  system:
    shutdown: str
    restart: str
  logging:
    console: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
    file: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
image: ghcr.io/mreditor97/redreactor/{arch}
